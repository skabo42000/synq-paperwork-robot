[project]
name = "synq-paperwork"
version = "0.1.0"
description = "Invoice extraction, deterministic checks, human review and an n8n Sheets handoff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
synq-paperwork = "synq_paperwork:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Project lives in OneDrive: copy files instead of hard-linking from the uv cache
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
